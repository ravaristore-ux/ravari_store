name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install sshpass
      run: sudo apt-get install -y sshpass

    - name: Build Frontend
      run: |
        cd frontend
        npm install
        CI=false npm run build

    - name: Upload frontend build
      run: |
        for i in 1 2 3; do
          echo "=== Upload attempt $i ==="
          sshpass -p "$HOSTINGER_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -P 65002 \
            -r frontend/build/. \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/$HOSTINGER_USER/nodejs/frontend/build/" \
          && echo "Frontend upload succeeded!" && break \
          || { echo "Attempt $i failed, retrying in 20s..."; sleep 20; }
        done
      env:
        HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
        HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}

    - name: Upload backend files
      run: |
        for i in 1 2 3; do
          echo "=== Backend upload attempt $i ==="
          sshpass -p "$HOSTINGER_PASSWORD" scp \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -P 65002 \
            backend/server.js backend/package.json \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/$HOSTINGER_USER/nodejs/backend/" \
          && echo "Backend upload succeeded!" && break \
          || { echo "Attempt $i failed, retrying in 20s..."; sleep 20; }
        done
      env:
        HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
        HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}

    - name: Install backend dependencies
      run: |
        for i in 1 2 3; do
          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p 65002 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "source ~/.nvm/nvm.sh 2>/dev/null; cd /home/$HOSTINGER_USER/nodejs/backend && npm install --production 2>&1 | tail -5 && echo 'npm install done'" \
          && break \
          || { echo "Attempt $i failed, retrying in 20s..."; sleep 20; }
        done
      env:
        HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
        HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}

    - name: Restart server
      run: |
        for i in 1 2 3; do
          sshpass -p "$HOSTINGER_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p 65002 \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            "source ~/.bashrc 2>/dev/null; source ~/.profile 2>/dev/null; source ~/.nvm/nvm.sh 2>/dev/null; export PATH=\$PATH:/usr/local/bin:\$HOME/.npm-global/bin; pm2 restart all 2>/dev/null || (pkill -f 'node' || true; sleep 2; cd /home/$HOSTINGER_USER/nodejs && nohup node backend/server.js > app.log 2>&1 & echo 'Server restarted PID:'\$!)" \
          && echo "Restart done!" && break \
          || { echo "Attempt $i failed, retrying..."; sleep 20; }
        done
      env:
        HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
        HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
        HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}

    - name: Done
      run: echo "Deployed! Check https://ravari.in" && date
